name: CI
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check structure and scoring
        run: |
          npm run check
          npm run smoke
      - name: Check JavaScript syntax
        shell: bash
        run: |
          find api functions src scripts cloudflare -type f -name '*.js' -print0 | while IFS= read -r -d '' f; do node --check "$f"; done
